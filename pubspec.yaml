name: dgfx
description: >-
  Motor gráfico 2D em Dart puro: rasterização analítica com anti-aliasing,
  gradientes, padrões, stroking, clipping e texto OpenType. Sem dependências.
version: 1.0.0
repository: https://github.com/insinfo/dgfx
issue_tracker: https://github.com/insinfo/dgfx/issues
documentation: https://github.com/insinfo/dgfx#readme

topics:
  - graphics
  - rasterizer
  - vector
  - canvas
  - opentype

environment:
  sdk: ^3.6.0

# O motor não tem dependências de runtime: só `dart:core`, `dart:math`,
# `dart:typed_data` e `dart:async`. Isso mantém o pacote compilável para
# native, web e wasm sem carregar nada junto.

dev_dependencies:
  lints: ^5.0.0
  test: ^1.26.3
  # Usado apenas pelos benchmarks, para gravar PNGs de inspeção visual.
  archive: ^4.0.7
